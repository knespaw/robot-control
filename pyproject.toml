[project]
name = "rbctrl"
version = "0.1.0"
description = "Python environment used to export YOLO models and implement a bluetooth controller used to connect to MegaPi and steer the robot."
requires-python = ">=3.14"

[dependency-groups]
controller = [
    "bleak>=3.0.1",
    "pygame>=2.6.1",
]

yolo = [
    "ultralytics>=8.4.41",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

onnx-models = [
    "onnx>=1.21.0",
    "onnxslim>=0.1.91",
    "onnxruntime>=1.25.0",
    "netron>=9.0.4",
]

lint = [
    "isort>=8.0.1",
    "black>=26.1.0",
    "flake8>=7.3.0",
    "Flake8-pyproject>=1.2.4",
]

[tool.isort]
py_version = 314
profile = "black"
line_length = 88

[tool.blake]
py_version = 314
line_length = 88

[tool.flake8]
py_version = 314
max-line-length = 88
